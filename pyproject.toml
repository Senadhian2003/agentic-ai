[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "resend>=2.36.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tavily-python>=0.5.0",
    "langchain>=0.3.27",
    "langchain-anthropic>=0.3.14",
    "langchain-google-genai>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
start = "api:start"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "tools/*.py"]
